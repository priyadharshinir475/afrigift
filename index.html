<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- Background Effects -->

<div id="hearts"></div>

<div id="stars"></div>

<div id="sparkles"></div>

<div id="roses"></div>

<div id="balloons"></div>

<!-- Royal Curtain -->

<div class="curtain curtain-left"></div>

<div class="curtain curtain-right"></div>

<!-- Main Container -->

<div class="main-container">

    <div class="login-box">

        <h1 class="title">
            Happy Birthday
        </h1>

        <p class="subtitle">
            Welcome To Your Special Surprise
        </p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">

                Open My Surprise ❤️

            </button>

        </form>

    </div>

</div>
<!-- Golden Border -->

<div class="gold-frame top"></div>
<div class="gold-frame bottom"></div>
<div class="gold-frame left"></div>
<div class="gold-frame right"></div>

<!-- Music -->

<audio id="bgMusic" preload="auto">
    <source src="music/song.mp3" type="audio/mpeg">
</audio>

<!-- Footer -->

<div class="footer-text">

    Made With ❤️ For Someone Special

</div>

<script src="login.js"></script>

</body>
</html>
